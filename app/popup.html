<!DOCTYPE html>
<html lang="en" ng-app="popup" ng-csp>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Vite will handle CSS imports through main.js -->
    <title>Popup Extension</title>
  </head>

  <body>
    <ul class="nav nav-tabs">
      <li ui-sref-active="active">
        <a ui-sref="overview" href>
          <i class="fa fa-fw fa-eye"></i> Overview
        </a>
      </li>
      <li ui-sref-active="active">
        <a ui-sref="rules" href>
          <i class="fa fa-fw fa-cogs"></i> Rules
        </a>
      </li>
      <li ui-sref-active="active">
        <a ui-sref="cart" href>
          <i class="fa fa-fw fa-shopping-cart"></i> Cart
        </a>
      </li>
    </ul>
    <div ui-view></div>
    <div class="load-mask" ng-controller="LoadMaskController as loadMask" ng-show="loadMask.isVisible">
      <img src="./images/duke.png" />
      <div class="load-mask-inner">
        <i class="fa fa-fw fa-spinner fa-spin"></i>
      </div>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
